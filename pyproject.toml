[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "caprl"
version = "0.1.0"
description = "Regime-constrained reinforcement learning for trend following"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyyaml>=6.0"]

[project.optional-dependencies]
research = ["scipy>=1.11", "scikit-learn>=1.3", "pyarrow>=14"]
rl = ["gymnasium>=0.29", "torch>=2.1"]
plots = ["matplotlib>=3.8"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/caprl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
